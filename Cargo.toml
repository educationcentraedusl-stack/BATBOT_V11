[package]
name = "batbot_v11_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.14", default-features = false, features = ["async", "napi4", "tokio_rt"] }
napi-derive = "2.16.11"
candle-core = "0.8.2"
candle-nn = "0.8.2"
safetensors = "0.4"
tokio = { version = "1.43.0", features = ["full"] }
tokio-tungstenite = { version = "0.26.1", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
futures-util = "0.3"
crossbeam-queue = "0.3"
url = "2.5"
lazy_static = "1.5"
reqwest = { version = "0.11", default-features = false, features = ["default-tls"] }
memmap2 = "0.9"
arc-swap = "1.7"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
fast-float = "0.2"

[build-dependencies]
napi-build = "2.1.3"

