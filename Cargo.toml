[package]
name = "batbot_v11_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.14", default-features = false, features = ["async", "napi4", "tokio_rt"] }
napi-derive = "2.16.11"
candle-core = "0.8.2"
candle-nn = "0.8.2"
tokio = { version = "1.43.0", features = ["full"] }
tokio-tungstenite = { version = "0.26.1", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
crossbeam-queue = "0.3"
url = "2.5"

[build-dependencies]
napi-build = "2.1.3"

